<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The Chrome Web Store's small promo tile, 440×280 (scripts/extension-store-shots.ts renders it). -->
    <style>
      @font-face { font-family: "Jun Outfit"; font-weight: 100 900; src: url("../../public/fonts/outfit-latin-wght-normal.woff2") format("woff2"); }
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body { display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 36px; box-sizing: border-box; background: radial-gradient(120% 90% at 85% 10%, #3a2f4a 0%, #121214 60%); color: #f5f5f5; font-family: "Jun Outfit", sans-serif; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
      .brand img { width: 40px; height: 40px; }
      p { margin: 0; font-size: 19px; line-height: 1.35; color: #d6d3dc; max-width: 330px; }
      .pill { display: flex; align-items: center; gap: 10px; width: 290px; height: 40px; padding: 0 14px; border-radius: 20px; background: #0c0c0d; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 8px 24px rgba(0, 0, 0, 0.4); color: #8d8a94; font-size: 14px; }
      .pill img { width: 18px; height: 18px; }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../../public/jun-agent.svg" alt="" />Jun</div>
    <p>Ask how to do anything on the page you're on.</p>
    <div class="pill"><img src="../../public/jun-agent.svg" alt="" />Where do I download invoices?</div>
  </body>
</html>
