# T-17: pushing a version tag (`npm run release`, then `git push origin main --follow-tags`)
# publishes it as a GitHub Release, with notes from the commits since the last one. Installs'
# Update Jun workflow picks up the latest release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'samarsheikh001/jun'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Jun $GITHUB_REF_NAME" --generate-notes --verify-tag
